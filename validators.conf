# solo-dev validators. Runner: ./validate · doctrine: skills/_shared/validators.md
#
# This repo is markdown plus a few shell and python helpers, so the gate is a
# syntax sweep over every script plus the self-test suites that ship with the
# bundle. Both stages run the same rows: nothing here is slow enough to justify
# deferring a row to finalize.
#
# The `triage` row matters more than its name suggests. This bundle is produced
# from a private repo by a script that rewrites project names out of every
# file, fixtures included, and that row is what proves the rewrite left a
# working suite rather than a plausible-looking one.
#
# stage | id | command      (phase-exit = every phase · finalize = once · user = handed over)

phase-exit | syntax | find . -name '*.sh' -not -path './.git/*' -exec sh -n {} + && sh -n validate && sh -n skills/_shared/validate
phase-exit | runner | sh skills/_shared/test_validate.sh
phase-exit | gate   | python3 skills/execute/scripts/test_run_arch_gate.py
phase-exit | triage | python3 skills/triage/scripts/run_tests.py
phase-exit | mirror | cmp validate skills/_shared/validate
finalize   | syntax | find . -name '*.sh' -not -path './.git/*' -exec sh -n {} + && sh -n validate && sh -n skills/_shared/validate
finalize   | runner | sh skills/_shared/test_validate.sh
finalize   | gate   | python3 skills/execute/scripts/test_run_arch_gate.py
finalize   | triage | python3 skills/triage/scripts/run_tests.py
finalize   | mirror | cmp validate skills/_shared/validate
